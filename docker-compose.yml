version: '3.8'

services:
  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    container_name: bff
    environment:
      URL_REPORTS: http://reports1:8082
      URL_SOLUTIONS: http://solutions2:8083
    depends_on:
      - reports1
      - solutions2
    networks:
      - citycare-net

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-server
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bff
    networks:
      - citycare-net

  solutions2:
    build:
      context: .
      dockerfile: solutions2/Dockerfile
    container_name: solutions2
    ports:
      - "8083:8083"
    env_file:
      - .env
    networks:
      - citycare-net

  reports1:
    build:
      context: .
      dockerfile: reports1/Dockerfile
    container_name: reports1
    ports:
      - "8082:8082"
    env_file:
      - .env
    networks:
      - citycare-net

networks:
  citycare-net:
    driver: bridge