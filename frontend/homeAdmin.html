<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityCare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="icon" href="./images/favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="d-flex flex-column min-vh-100">
  <header class="bg-white border-bottom shadow-sm mb-3 sticky-top">
    <div class="container py-2">
      <div class="d-flex align-items-center justify-content-between">
        <a href="#" class="d-flex align-items-center text-decoration-none text-primary navbar-brand fs-3">
          <i class="fa-solid fa-users-between-lines me-2"></i>
          <span>CityCare</span>
        </a>
        <!-- Sezione Utente -->
        <div class="d-flex align-items-center gap-3">
          <div class="text-end">
            <div class="text-secondary">Ciao <strong>Admin</strong></div>
          </div>
          <button class="btn btn-outline-danger btn-sm" type="button" onclick="location.href = 'login.html'">
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="container mb-4">
    <div class="row">
      <div class="col-6">
        <div class="content-card border border-primary p-4">
          <h4 class="fw-bold"><i class="fa-solid fa-bullhorn"></i>Nuove Segnalazioni</h4>
          <p class="text-secondary">
            Hai <b id="numero-requests"></b> nuova/e segnalazione/i.
          </p>
          <div class="text-primary-emphasis" id="reportsContainer">
            <!-- JS content -->
          </div>
        </div>
      </div>

      <!-- Registro Segnalazioni -->
      <section class="col">
        <div class="content-card p-4 flex-fill">
          <h4 class="fw-bold">
            <i class="fa-solid fa-person-military-pointing"></i> Le nostre
            Soluzioni
          </h4>
          <p class="text-secondary">
            Hai risolto <b id="numero-solutions"></b> segnalazione/i.
          </p>
          <div class="text-primary-emphasis" id="solutionsContainer">
            <!-- JS content -->
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    <div class="container">
      &copy; 2026 CityCare - Segnalazione Disservizi Residenziali
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script/homeAdmin.js"></script>
</body>

</html>
