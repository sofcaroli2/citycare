<!doctype html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accedi - CityCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="./images/favicon.ico" />
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="bg-white border-bottom shadow-sm">
        <div class="container py-2">
            <a href="login.html" class="d-flex align-items-center text-decoration-none text-primary navbar-brand fs-3">
                <i class="fa-solid fa-users-between-lines me-2" aria-hidden="true"></i>
                <span>CityCare</span>
            </a>
        </div>
    </header>

    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <section class="content-card w-100 p-4 p-md-5" style="max-width: 440px;" aria-labelledby="login-title">
            <div class="mb-4">
                <h1 id="login-title" class="h3 fw-bold mb-2">Accedi</h1>
                <p class="text-secondary mb-0">Entra in CityCare per gestire le tue segnalazioni.</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <input id="email" name="email" type="email" class="form-control" autocomplete="username"
                        placeholder="nome@esempio.it" required />
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input id="password" name="password" type="password" class="form-control"
                        autocomplete="current-password" placeholder="Inserisci la password" required />
                </div>

                <p id="loginMessage" class="text-danger small" role="alert" aria-live="polite"></p>

                <button type="submit" class="btn btn-primary btn-custom-submit w-100">
                    Accedi
                </button>
            </form>
        </section>
    </main>

    <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
        <div class="container">
            &copy; 2026 CityCare - Segnalazione Disservizi Residenziali
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
